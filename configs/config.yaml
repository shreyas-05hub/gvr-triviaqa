    Reported per arm, v1 vs v2, ONLY: answer-length profile (words mean/median/p90/max; model tokens excl. EOS), % answers > 5 words, % full sentences (>=5 words AND (first line ends '.' OR finite-verb keyword)), parse/invalid rate, E1 plan-invalid rate, paraphrase flags (Jaccard >= 0.7). NOT computed or reported on this run: EM, accuracy, F1, any gold-based category.
    Acceptance (per arm E0, E1, E3, on the v2 run): % > 5 words <= 1% AND % full sentence <= 1% AND invalid rate (v2) <= invalid rate (v1). If met -> PI reviews prompts for freeze. If not -> stop and report.
  thresholds: {max_pct_gt5_words: 0.01, max_pct_full_sentence: 0.01, invalid_not_worse_than_v1: true}
  baseline_run: pilot-01
  v2_run: pilot-02-v2
  status: SUPERSEDED   # by format_compliance_rule v2 at 2026-10-07T17:05:18.638310+00:00

format_compliance_rule:     # v2, amended 2026-10-07T17:05:18.638310+00:00 BEFORE any format_check result was viewed
  sha256: 48fde62988a8e735fd8a2e437dbe9568fa57a6c19b566325a34d440a3987965c
  text: |
    format_compliance_rule v2 (amended by PI 2026-10-07 BEFORE any format_check result was viewed; supersedes v1 sha 5b7e413bec8840e8060e9b368e6fa9c525506fcd336fb9a505b68639418556dc):
    Run: the 60 PILOT items, E0/E1/E3, prompts v2 (user_qa_v2, user_rag_v2, user_cove_revise_v2), all other settings unchanged (decoding, k, passages, NF4, single T4). Baseline: pilot-01 (prompts v1). Both runs parsed with parser 1.1.
    Reported per arm, v1 vs v2, ONLY: answer-length profile (words mean/median/p90/max; model tokens excl. EOS), % answers > 5 words, % full sentences (>=5 words AND (first line ends '.' OR finite-verb keyword)), parse/invalid rate, E1 plan-invalid rate, paraphrase flags (Jaccard >= 0.7). NOT computed or reported on this run: EM, accuracy, F1, any gold-based category.
    Acceptance (per arm E0, E1, E3, on the v2 run): % > 5 words <= 2% AND % full sentence <= 2% (i.e., at most 1 of 60 items each) AND invalid rate (v2) <= invalid rate (v1). If met -> PI reviews prompts for freeze. If not -> stop and report.
    Reason for amendment: with n = 60 per arm, "<= 1%" means zero items, stricter than intended.
  thresholds: {max_pct_gt5_words: 0.02, max_pct_full_sentence: 0.02, invalid_not_worse_than_v1: true}
  baseline_run: pilot-01
  v2_run: pilot-02-v2
  supersedes_sha256: 5b7e413bec8840e8060e9b368e6fa9c525506fcd336fb9a505b68639418556dc
