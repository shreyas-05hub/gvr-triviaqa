test_execution_rule:        # recorded 2026-10-07T17:47:23.568495+00:00 BEFORE any test run
  sha256: 948908fd51f5591ec8b498ef7dadd604ed24b72730b102d2707a201f9202f491
  text: |
    test_execution_rule (pre-registered by PI 2026-10-07; recorded BEFORE any test run):
    1. Test set: data/test_ids.json (3,000 validation IDs, seed 20261003, sha a792e0d7...), fixed draw order; chunks c1 = [0,1000), c2 = [1000,2000), c3 = [2000,3000); run-ids test-c1, test-c2, test-c3.
    2. Per item in order: E0, then E1 (consumes that item's LOGGED E0 answer), then E3; frozen prompts, final gate, NF4, single T4, batch size 1; BM25 guarded load + smoke regression (titles vs reference, k1/b read-back, empty OpenAI-guard log) before each session's arms; no judge.
    3. Resumable and idempotent: append-only calls.jsonl; unit (item, arm) done iff units.jsonl marker; on resume done units are skipped, calls of incomplete units are listed in superseded.jsonl and the unit is rerun; at most one retry per call as before.
    4. Abort before any download/model load if: test_unlocked is not true; no LOCKED test_lock; any frozen-prompt, gate.json, config.yaml, test_ids or model-revision hash differs from the test_lock recorded immediately before the first chunk push; gate provisional; dataset mount version != expected.
    5. No EM, accuracy, F1 or any gold access is computed or viewed until all 3 chunks are complete and scripts/test_completeness.py passes (3,000 items x 3 arms). Between chunks only completion counts, error/retry counts and invalid counts are reported. Enforced in code: load_gold refuses non-train splits until test_completeness.passed is true.
    6. After completion: analysis per protocol (EM primary, F1 secondary, McNemar E2 vs E4 primary; secondary comparisons; random gate) and the em_validity_plan item 3 human sample.
  chunks: {c1: [0, 1000], c2: [1000, 2000], c3: [2000, 3000]}
  status: PREREGISTERED
